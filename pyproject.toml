[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sigalg"
version = "0.1.11"
description = "Measure-Theoretic Probability in Python"
readme = "README.md"
authors = [{ name = "John Myers", email = "john@johnmyers-phd.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.13"
keywords = [
    "probability",
    "measure-theory",
    "mathematics",
    "stochastic-processes",
    "martingales",
    "quantitative-finance",
    "sigma-algebra",
    "random-variables",
    "conditional-expectation",
    "brownian-motion",
    "stochastic-calculus",
    "ito-integral",
    "financial-mathematics",
    "option-pricing",
    "risk-neutral-measure"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "scipy>=1.16.0",
    "matplotlib",
    "scikit-learn",
    "plotly",
    "pydantic",
    "mkdocs-material[imaging]>=9.7.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "ipykernel",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.3",
    "nbmake>=1.5.5",
]

[project.urls]
Repository = "https://github.com/jmyers7/sigalg"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src", "docs/docs/api/notebooks"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--doctest-modules",
    "--nbmake",
    "--tb=short",
    "--ignore=src/sigalg/validation",
    "--cov=sigalg",
    "--cov-report=xml",
    "--cov-report=lcov",
    "--cov-report=term-missing",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/sigalg"]
branch = true
omit = [
    "*/__init__.py",
    "*/tests/*",
    "*/test_*.py",
]
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "if TYPE_CHECKING",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.lcov]
output = "coverage.lcov"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    "docs/",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "D",  # pydocstyle
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "D100",  # missing docstring in public module
    "B905",  # zip() without explicit strict= parameter
    "E741",  # ambiguous variable name
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["D"]
