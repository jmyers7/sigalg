site_name: SigAlg Documentation

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - toc.integrate
    - toc.follow  # Scroll TOC with page

nav:
  - Home: index.md
  - API:
      - Overview: api/index.md
      - Core: api/core.md
      - L^2 Spaces: api/l2.md
      - Stochastic Processes: api/processes.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
