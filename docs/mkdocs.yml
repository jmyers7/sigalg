site_name: sigalg
site_description: Measure-Theoretic Probability in Python
site_url: https://johnmyers-phd.com/sigalg/

theme:
  name: material
  favicon: assets/favicon-sa.svg
  logo: assets/sigalg-dark.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate
    - toc.follow
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        # icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        # icon: material/brightness-4
        name: Switch to system preference
    

  icon:
    repo: fontawesome/brands/git

nav:
  - Home: index.md
  - Getting Started: getting_started/index.md
  # - Dictionary & Tutorials: dictionary-tutorials/index.md
  - API Reference:
      - Overview: api/index.md
      - Core: api/core.md
      - L^2 Spaces: api/l2.md
      - Stochastic Processes: api/processes.md
      - Finance: api/finance.md

plugins:
  - tags
  - social:
      cards_layout_dir: layouts
      cards_layout: custom.yml
      # debug: true
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            separate_signature: true

markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
      base_path: docs/code_snippets/scripts

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/mathjax.js

extra_css:
  - stylesheets/extra.css
  
extra:
  social:
    - icon: fontawesome/brands/git
      link: https://github.com/jmyers7/sigalg
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/sigalg
      name: PyPI
  
repo_url: https://github.com/jmyers7/sigalg
repo_name: jmyers7/sigalg