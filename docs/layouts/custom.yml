size: { width: 1200, height: 630 }

tags:
  og:type: website
  og:title: "{{ page.meta.get('title', page.title) }}"
  og:description: "{{ page.meta.get('description', config.site_description) or '' }}"
  og:image: "{{ image.url }}"
  og:image:type: "{{ image.type }}"
  og:image:width: "{{ image.width }}"
  og:image:height: "{{ image.height }}"
  og:url: "{{ page.canonical_url }}"
  twitter:card: summary_large_image
  twitter:title: "{{ page.meta.get('title', page.title) }}"
  twitter:description: "{{ page.meta.get('description', config.site_description) or '' }}"
  twitter:image: "{{ image.url }}"

layers:
  - background:
      image: layouts/background.png
  - size: { width: 1100, height: 420 }
    offset: { x: 130, y: 50 }
    typography:
      content: "sig"
      align: start
      color: "#f0f0f0"
      line:
        amount: 1
        height: 1.25
      font:
        family: Roboto
        style: ExtraBold Italic
  - size: { width: 1100, height: 420 }
    offset: { x: 600, y: 50 }
    typography:
      content: "alg"
      align: start
      color: "#ff0080"
      line:
        amount: 1
        height: 1.25
      font:
        family: Roboto
        style: ExtraBold Italic
  - size: { width: 1000, height: 63 }
    offset: { x: 130, y: 475 }
    typography:
      content: "Measure-Theoretic Probability in Python"
      align: start
      color: "#f0f0f0"
      line:
        amount: 1
        height: 0.25
      font:
        family: Roboto
        style: Italic