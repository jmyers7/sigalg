name: Run tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            numpy-version: "2.1.*"
            pandas-version: "2.2.*"
            scipy-version: "1.13.*"
          - os: ubuntu-latest
            python-version: "3.12"
            numpy-version: "2.2.*"
            pandas-version: "2.2.*"
            scipy-version: "1.14.*"
          - os: ubuntu-latest
            python-version: "3.13"
            numpy-version: "2.3.*"
            pandas-version: "2.3.*"
            scipy-version: "1.16.*"
          - os: ubuntu-latest
            python-version: "3.13"
            numpy-version: "2.4.*"
            pandas-version: "3.0.*"
            scipy-version: "1.16.*"
          - os: macos-latest
            python-version: "3.13"
            numpy-version: "2.3.*"
            pandas-version: "2.3.*"
            scipy-version: "1.16.*"
          - os: macos-latest
            python-version: "3.13"
            numpy-version: "2.4.*"
            pandas-version: "3.0.*"
            scipy-version: "1.16.*"
          - os: windows-latest
            python-version: "3.13"
            numpy-version: "2.3.*"
            pandas-version: "2.3.*"
            scipy-version: "1.16.*"
          - os: windows-latest
            python-version: "3.13"
            numpy-version: "2.4.*"
            pandas-version: "3.0.*"
            scipy-version: "1.16.*"
      
      fail-fast: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --force-reinstall pandas==${{ matrix.pandas-version }}
          pip install --force-reinstall scipy==${{ matrix.scipy-version }}
          pip install --force-reinstall --no-deps numpy==${{ matrix.numpy-version }}

      - name: Display versions
        run: |
          python -c "import numpy; print(f'NumPy: {numpy.__version__}')"
          python -c "import pandas; print(f'Pandas: {pandas.__version__}')"
          python -c "import scipy; print(f'SciPy: {scipy.__version__}')"

      - name: Run tests
        run: |
          pytest tests src --doctest-modules

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && matrix.numpy-version == '2.3.*' &&matrix.pandas-version == '2.3.*' && matrix.scipy-version == '1.16.*'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml