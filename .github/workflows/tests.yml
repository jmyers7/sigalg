name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
            numpy-version: "2.3.*"
            pandas-version: "2.3.*"
            scipy-version: "1.16.*"
          - os: ubuntu-latest
            python-version: "3.13"
            numpy-version: "2.4.*"
            pandas-version: "3.0.*"
            scipy-version: "1.16.*"
          - os: macos-latest
            python-version: "3.13"
            numpy-version: "2.3.*"
            pandas-version: "2.3.*"
            scipy-version: "1.16.*"
          - os: macos-latest
            python-version: "3.13"
            numpy-version: "2.4.*"
            pandas-version: "3.0.*"
            scipy-version: "1.16.*"
          - os: windows-latest
            python-version: "3.13"
            numpy-version: "2.3.*"
            pandas-version: "2.3.*"
            scipy-version: "1.16.*"
      
      fail-fast: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --group dev
          uv pip install --force-reinstall pandas==${{ matrix.pandas-version }}
          uv pip install --force-reinstall scipy==${{ matrix.scipy-version }}
          uv pip install --force-reinstall --no-deps numpy==${{ matrix.numpy-version }}

      - name: Display versions
        run: |
          uv run python -c "import numpy; print(f'NumPy: {numpy.__version__}')"
          uv run python -c "import pandas; print(f'Pandas: {pandas.__version__}')"
          uv run python -c "import scipy; print(f'SciPy: {scipy.__version__}')"

      - name: Run tests
        run: uv run pytest tests src --doctest-modules

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && matrix.numpy-version == '2.3.*' && matrix.pandas-version == '2.3.*' && matrix.scipy-version == '1.16.*'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml